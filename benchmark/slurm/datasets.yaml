# AgML Benchmark Dataset Config
# ─────────────────────────────────────────────────────────────────────────────
# One list for every task. Run it with:
#   python -m benchmark.run                          every entry
#   python -m benchmark.run --task object_detection  one task
#   python -m benchmark.run --dataset NAME           one entry
#
# Fields for every task:
#   name            Dataset path, Hugging Face (Project-AgML/...) or
#                   agml (iNatAg/... or iNatAg-mini/...)    [required]
#   task            image_classification (default) or object_detection
#   phases          Space-separated phase numbers to run
#   hf_config_name  HF dataset config name (e.g. "raw")
#   image_col       Column containing images
#
# Extra fields for image_classification:
#   label_col            Column containing class labels
#   compound_label_cols  List of columns to join into a compound label
#
# Extra fields for object_detection:
#   objects_col     Column with the boxes and categories
#   bbox_key        Key of the boxes inside objects_col
#   category_key    Key of the categories inside objects_col
#   bbox_format     auto | coco | coco_normalized | yolo | voc
#                   (coco_normalized is top-left xywh in 0-1, yolo is centre xywh in 0-1)
#
# defaults: top-level keys apply to every entry, the block named after a task
# applies to that task only. Keys set on an entry win over both.
# ─────────────────────────────────────────────────────────────────────────────

defaults:
    task: "image_classification"
    phases: "1 2 3"
    hf_config_name: ""
    image_col: "image"
    image_classification:
        label_col: "label"
        compound_label_cols: []
    object_detection:
        objects_col: "objects"
        bbox_key: "bbox"
        category_key: "categories"
        bbox_format: "auto"

