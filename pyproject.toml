[project]
name = "agml-benchmarking"
version = "0.1.0"
description = "Dataset quality benchmark for agricultural image classification, plus the experiments that validate it"
requires-python = ">=3.12"
# Benchmark pipeline and the shared core package
dependencies = [
    "agml",
    "cleanlab>=2.5.0",
    "datasets>=2.14.0",
    "faiss-gpu-cu12>=1.8.0; sys_platform == 'linux'",
    "faiss-cpu>=1.8.0; sys_platform != 'linux'",
    "numpy",
    "Pillow>=9.0.0",
    "PyYAML>=6.0",
    "scikit-learn>=1.3.0",
    "torch>=2.0.0",
    "torchvision>=0.15.0",
    "tqdm>=4.65.0",
    "transformers>=4.56.0",
    "umap-learn>=0.5.0",
]

[project.optional-dependencies]
# Fine-tuning and encoder sensitivity
experiments = [
    "matplotlib",
    "open_clip_torch>=3.3.0",
    "pandas",
    "timm>=1.0.0",
]
# Zero-shot (vLLM). Kept as its own extra so the vLLM environment can stay separate
zero-shot = [
    "huggingface_hub",
    "transformers>=5.5.0",
    "vllm>=0.29.0; sys_platform == 'linux'",
]

[tool.uv]
# Code runs with python -m from the repo root, nothing is installed as a package
package = false
